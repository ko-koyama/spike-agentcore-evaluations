# プロジェクトのメタ情報
[project]
name = "spike-agentcore-evaluations"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aws-opentelemetry-distro>=0.19.0",
    "awscrt>=0.36.2",
    "bedrock-agentcore[strands-agents-evals]>=1.22.0",
    "boto3>=1.43.88",
    "strands-agents>=1.54.0",
    "strands-agents-tools>=0.8.7",
]

# 開発環境でのみ利用するパッケージ
[dependency-groups]
dev = [
    "pre-commit",
    "ruff",
]

# ruff
[tool.ruff]
extend-exclude = ["docs/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
